name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        # Every macOS GitHub still runs, Apple silicon and Intel. Older systems
        # (11 to 13) are held by the compile check below.
        os: [macos-14, macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.sh reads the version from the last tag
      - name: Compiles for macOS 11 (both architectures)
        run: |
          swiftc -swift-version 5 -target arm64-apple-macos11.0 -typecheck app/Sources/*.swift
          swiftc -swift-version 5 -target x86_64-apple-macos11.0 -typecheck app/Sources/*.swift
      - name: Test
        run: scripts/test.sh
      - name: Build (universal, signed ad hoc)
        run: SIGN=- scripts/build.sh
      - name: Check the bundle
        run: |
          lipo -archs build/Wham.app/Contents/MacOS/Wham | grep -q "x86_64 arm64"
          test "$(find build/Wham.app/Contents/Resources -name Localizable.strings | wc -l)" -eq 10
      - name: Eval (the real app, its budgets, the real flag)
        run: scripts/eval.sh
        env:
          WHAM_SHOTS: ${{ runner.temp }}/menu
      # The open menu at each step of Check for Updates, as this macOS draws it,
      # and the menu and the notes in German, Japanese, French and Traditional Chinese.
      - name: Keep the menu's pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-${{ matrix.os }}
          path: ${{ runner.temp }}/menu
          if-no-files-found: warn
      - name: Check the npm package
        run: |
          node --check npm/bin/wham.js
          cd npm && npm pack --dry-run

